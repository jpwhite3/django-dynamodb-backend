[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-dynamodb-backend"
version = "1.0.0"
description = "A comprehensive Django database backend for Amazon DynamoDB."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Django DynamoDB Backend Contributors", email = "contributors@django-dynamodb-backend.org"}
]
keywords = [
    "django",
    "dynamodb",
    "amazon",
    "aws",
    "admin",
    "orm",
    "database",
    "nosql",
    "web",
    "framework",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "django>=4.2",
    "pynamodb>=6.0.0",
    "boto3>=1.28.0",
    "botocore>=1.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.3.0",
    "moto>=5.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "coverage>=7.0.0",
]
redis = [
    "redis>=5.0.0",
    "django-redis>=5.4.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/jpwhite3/django-dynamodb-backend"
Documentation = "https://django-dynamodb-backend.readthedocs.io"
Repository = "https://github.com/jpwhite3/django-dynamodb-backend"
Issues = "https://github.com/jpwhite3/django-dynamodb-backend/issues"
Discussions = "https://github.com/jpwhite3/django-dynamodb-backend/discussions"

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_dynamodb_backend*"]

[tool.setuptools.package-data]
django_dynamodb_backend = [
    "templates/admin/*.html",
    "templates/admin/django_dynamodb_backend/*.html",
    "static/admin/django_dynamodb_backend/css/*.css",
    "static/admin/django_dynamodb_backend/js/*.js",
]

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
skip = [".venv", "venv", ".git"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "migrations",
    "dynamodb_migrations",
    ".venv",
]

[tool.coverage.run]
source = ["src/django_dynamodb_backend"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/dynamodb_migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
