[tox]
envlist =
    py{311,312,313}-django{52,60}
    lint

[testenv]
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0a1,<6.1
    pynamodb>=6.0.0
    boto3>=1.28.0
    moto>=5.0.0
    pytest>=8.0.0
    pytest-django>=4.5.0
    pytest-cov>=4.0.0
    pytest-timeout>=2.3.0
commands =
    pytest {posargs:tests/}

[testenv:lint]
deps =
    black>=24.0.0
    flake8>=7.0.0
    isort>=5.13.0
commands =
    black --check src/ tests/
    isort --check-only src/ tests/
    flake8 src/ tests/
