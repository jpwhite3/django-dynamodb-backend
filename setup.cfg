[flake8]
exclude =
    .venv,
    venv,
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    .eggs,
    migrations,
    .tox
max-line-length = 127
max-complexity = 10

[isort]
profile = black
line_length = 88
skip = .venv,venv,.git,__pycache__,build,dist

[mypy]
python_version = 3.13
ignore_missing_imports = True
