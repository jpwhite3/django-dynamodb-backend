[flake8]
exclude =
    .venv,
    venv,
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    .eggs,
    migrations,
    .tox
max-line-length = 127
# DynamoDB operations require complex logic for query translation and batch operations
max-complexity = 30
# E203 is incompatible with Black's formatting of slices
# W503 is incompatible with PEP8 (prefer W504)
ignore = E203, W503
