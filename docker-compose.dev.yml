# Django DynamoDB Admin - Interactive Development Environment
# Usage: docker-compose -f docker-compose.dev.yml up

version: '3.8'

services:
  # DynamoDB Local for interactive testing
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: django-dynamodb-interactive
    ports:
      - "8000:8000"  # DynamoDB Local endpoint
    environment:
      - JAVA_OPTS=-Xmx1024m
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data", "-port", "8000"]
    volumes:
      - dynamodb_interactive_data:/home/dynamodblocal/data
    networks:
      - django-interactive
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/shell"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Django application with sample data
  django-app:
    build:
      context: .
      target: development
    container_name: django-interactive-app
    ports:
      - "8001:8000"  # Django admin interface
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=interactive_demo.settings
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_DEFAULT_REGION=us-east-1
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - django_interactive_media:/app/media
      - django_interactive_static:/app/staticfiles
    depends_on:
      dynamodb-local:
        condition: service_healthy
    networks:
      - django-interactive
    command: >
      bash -c "
        echo 'Waiting for DynamoDB Local to be ready...' &&
        sleep 10 &&
        echo 'Setting up interactive demo environment...' &&
        python manage.py migrate --settings=interactive_demo.settings &&
        python manage.py setup_demo_data --settings=interactive_demo.settings &&
        echo 'Demo environment ready!' &&
        echo 'Django Admin: http://localhost:8001/admin/' &&
        echo 'DynamoDB Admin UI: http://localhost:8002/' &&
        echo 'Username: admin | Password: admin123' &&
        python manage.py runserver 0.0.0.0:8000 --settings=interactive_demo.settings
      "

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: django-redis-interactive
    ports:
      - "6379:6379"
    volumes:
      - redis_interactive_data:/data
    networks:
      - django-interactive
    command: redis-server --appendonly yes

  # DynamoDB Admin UI for visual inspection
  dynamodb-admin-ui:
    image: aaronshaf/dynamodb-admin:latest
    container_name: django-dynamodb-admin-ui-interactive
    ports:
      - "8002:8001"  # DynamoDB Admin UI
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
    depends_on:
      - dynamodb-local
    networks:
      - django-interactive

  # Performance monitoring dashboard
  performance-monitor:
    build:
      context: .
      target: development
    container_name: django-performance-monitor
    ports:
      - "8003:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=interactive_demo.performance_settings
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_DEFAULT_REGION=us-east-1
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
    volumes:
      - .:/app
    depends_on:
      - dynamodb-local
      - redis
    networks:
      - django-interactive
    command: >
      bash -c "
        echo 'Starting performance monitoring dashboard...' &&
        python manage.py runserver 0.0.0.0:8000 --settings=interactive_demo.performance_settings
      "

volumes:
  dynamodb_interactive_data:
    driver: local
  redis_interactive_data:
    driver: local
  django_interactive_media:
    driver: local
  django_interactive_static:
    driver: local

networks:
  django-interactive:
    driver: bridge

# Quick start commands:
# docker-compose -f docker-compose.dev.yml up
# docker-compose -f docker-compose.dev.yml logs django-app
# docker-compose -f docker-compose.dev.yml exec django-app python manage.py shell --settings=interactive_demo.settings