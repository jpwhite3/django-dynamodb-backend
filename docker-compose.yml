# Django DynamoDB Admin - Docker Compose Configuration

version: '3.8'

services:
  # Main Django application
  web:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=django_dynamo_admin.settings
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - DYNAMODB_ENDPOINT=http://localstack:4566
    volumes:
      - .:/app
      - django_media:/app/media
      - django_static:/app/staticfiles
    depends_on:
      - localstack
      - redis
    networks:
      - django-network
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  # LocalStack for local AWS services
  localstack:
    image: localstack/localstack:latest
    container_name: django-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=dynamodb,s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
    volumes:
      - localstack_data:/tmp/localstack
    networks:
      - django-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: django-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - django-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Test runner service
  test:
    build:
      context: .
      target: test
    environment:
      - DJANGO_SETTINGS_MODULE=test_settings
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - DYNAMODB_ENDPOINT=http://localstack:4566
      - PYTHONPATH=/app:/app/django_dynamo_admin
    depends_on:
      - localstack
    networks:
      - django-network
    command: ["pytest"]
    profiles:
      - testing
    deploy:
      resources:
        limits:
          memory: 8G


  # Production-like environment
  web-prod:
    build:
      context: .
      target: production
    ports:
      - "8003:8000"
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=django_dynamo_admin.settings.production
      - AWS_DEFAULT_REGION=us-east-1
      - DYNAMODB_MAX_CONNECTIONS=20
      - DYNAMODB_ENABLE_CACHE=true
      - SECRET_KEY=your-production-secret-key-here
    volumes:
      - django_static_prod:/app/staticfiles
      - django_media_prod:/app/media
    depends_on:
      - redis
    networks:
      - django-network
    profiles:
      - production

# Named volumes for data persistence
volumes:
  localstack_data:
    driver: local
  redis_data:
    driver: local
  django_media:
    driver: local
  django_static:
    driver: local
  django_media_prod:
    driver: local
  django_static_prod:
    driver: local

# Custom network
networks:
  django-network:
    driver: bridge

# Override for production deployment
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
---
# docker-compose.prod.yml
version: '3.8'

services:
  web:
    build:
      target: production
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=django_dynamo_admin.settings.production
    profiles:
      - production

  # Remove development services
  dynamodb-local:
    profiles:
      - development
  
  dynamodb-admin:
    profiles:
      - development